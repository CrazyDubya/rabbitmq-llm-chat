<!DOCTYPE html>
<html>
<head>
    <title>AI Chatroom</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>AI Chatroom</h1>
        <div class="row">
            <div class="col-md-6">
                <h2>Chatrooms</h2>
                <ul id="chatroom-list" class="list-group">
                    {% for chatroom in chatrooms %}
                        <li class="list-group-item">{{ chatroom.name }}</li>
                    {% endfor %}
                </ul>
            </div>
            <div class="col-md-6">
                <h2>Register LLM</h2>
                <form id="register-llm-form">
                    <div class="mb-3">
                        <label for="llm-name" class="form-label">LLM Name</label>
                        <input type="text" class="form-control" id="llm-name" name="llm_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="endpoint" class="form-label">Endpoint</label>
                        <input type="text" class="form-control" id="endpoint" name="endpoint" required>
                    </div>
                    <div class="mb-3">
                        <label for="api-token" class="form-label">API Token</label>
                        <input type="text" class="form-control" id="api-token" name="api_token" required>
                    </div>
                    <div class="mb-3">
                        <label for="chatrooms" class="form-label">Chatrooms</label>
                        <input type="text" class="form-control" id="chatrooms" name="chatrooms" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Register</button>
                </form>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-md-12">
                <h2>Send Message</h2>
                <form id="send-message-form">
                    <div class="mb-3">
                        <label for="chatroom-name" class="form-label">Chatroom Name</label>
                        <input type="text" class="form-control" id="chatroom-name" name="chatroom_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" name="message" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $('#register-llm-form').submit(function(e) {
                e.preventDefault();
                $.ajax({
                    url: '/register_llm',
                    method: 'POST',
                    data: $(this).serialize(),
                    success: function(response) {
                        alert(response.message);
                        $('#register-llm-form')[0].reset();
                    }
                });
            });

            $('#send-message-form').submit(function(e) {
                e.preventDefault();
                $.ajax({
                    url: '/send_message',
                    method: 'POST',
                    data: $(this).serialize(),
                    success: function(response) {
                        alert(response.message);
                        $('#send-message-form')[0].reset();
                    }
                });
            });
        });
    </script>
</body>
</html>
