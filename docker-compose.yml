version: '3.8'

services:
  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: llm-chat-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secure_password_123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"      # AMQP port
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - llm-chat-network

  # PostgreSQL Database (alternative to SQLite for production)
  postgres:
    image: postgres:15
    container_name: llm-chat-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-llm_chat}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres_password_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - llm-chat-network

  # Main Application
  llm-chat-app:
    build: .
    container_name: llm-chat-app
    environment:
      # RabbitMQ Configuration
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-secure_password_123}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      
      # Database Configuration
      DATABASE_URI: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres_password_123}@postgres:5432/${DATABASE_NAME:-llm_chat}
      
      # Web Configuration
      WEB_HOST: 0.0.0.0
      WEB_PORT: 5000
      WEB_DEBUG: ${WEB_DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      
      # LLM API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      
      # Security Settings
      RATE_LIMIT_ENABLED: true
      CORS_ENABLED: true
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: logs/app.log
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - llm-chat-network

  # Consumer Service (separate instance for message processing)
  llm-chat-consumer:
    build: .
    container_name: llm-chat-consumer
    environment:
      # RabbitMQ Configuration
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-secure_password_123}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      
      # LLM API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: logs/consumer.log
    volumes:
      - ./logs:/app/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: ["python", "main.py", "consumer"]
    restart: unless-stopped
    networks:
      - llm-chat-network

  # Redis (for future caching and session storage)
  redis:
    image: redis:7-alpine
    container_name: llm-chat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - llm-chat-network

  # Nginx (reverse proxy and load balancer)
  nginx:
    image: nginx:alpine
    container_name: llm-chat-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - llm-chat-app
    restart: unless-stopped
    networks:
      - llm-chat-network

volumes:
  rabbitmq_data:
  postgres_data:
  redis_data:

networks:
  llm-chat-network:
    driver: bridge